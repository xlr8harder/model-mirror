name: Publish release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Validate release tag
        run: |
          python scripts/check_release.py "$GITHUB_REF_NAME"
          python scripts/changelog.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::release tag must be annotated"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-list -n 1 "$GITHUB_REF_NAME")" origin/main; then
            echo "::error::release tag must point to a commit on main"
            exit 1
          fi
      - name: Run test and coverage gate
        run: |
          uv sync --locked --all-extras --dev
          uv run coverage run -m pytest -q
          uv run coverage report -m
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - name: Publish to PyPI
        run: uv publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/changelog.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
