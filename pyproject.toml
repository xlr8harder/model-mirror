[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-mirror-cli"
version = "0.3.0"
description = "Mirror and validate Hugging Face archives without leaving payloads in the default cache."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "xlr8harder" },
]
keywords = ["huggingface", "model-archive", "mirror", "torrent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving",
]
dependencies = [
  "huggingface_hub>=1.0",
  "packaging>=24.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
torrent = [
  "libtorrent>=2.0.10,<2.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "coverage>=7.0",
  "libtorrent>=2.0.10,<2.1",
]

[project.scripts]
model-mirror = "model_mirror.cli:main"

[project.urls]
Repository = "https://github.com/xlr8harder/model-mirror"
Issues = "https://github.com/xlr8harder/model-mirror/issues"
Changelog = "https://github.com/xlr8harder/model-mirror/blob/main/CHANGELOG.md"
Releases = "https://github.com/xlr8harder/model-mirror/releases"

[tool.hatch.build.targets.wheel]
packages = ["model_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["model_mirror"]

[tool.coverage.report]
fail_under = 100
show_missing = true
